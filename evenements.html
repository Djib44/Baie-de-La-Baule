<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Événements — Presqu’île</title><style>*{box-sizing:border-box}body{margin:0;background:#eef5f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17323d}.wrap{max-width:950px;margin:auto}main{padding:14px}.card{background:#fff;border-radius:18px;padding:15px;box-shadow:0 3px 14px #063b5212;margin-bottom:10px}.muted{font-size:12px;color:#65747a}.event{padding:12px 0;border-bottom:1px solid #e5eceb}.event:last-child{border:0}.event a{color:#087a83;font-weight:700}header{background-position:center;background-size:cover;background-repeat:no-repeat;color:#fff;padding:34px 16px;position:relative}header:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,35,45,.72),rgba(5,35,45,.22))}header .wrap{position:relative;z-index:1}.nav{display:flex;gap:7px;overflow:auto;margin-top:15px}.nav a{background:#fff;color:#073b4c;text-decoration:none;padding:9px 12px;border-radius:999px;font-weight:700;white-space:nowrap}.coef{font-size:20px!important;font-weight:850!important;color:#17323d}.temps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tempitem{text-align:center}.tempitem .big{font-size:24px}@media(max-width:600px){.temps{grid-template-columns:1fr}.tempitem{text-align:left}}header{background-image:url("assets/hero-evenements.jpg");background-position:center 45%;min-height:250px}h1{margin:6px 0}</style></head><body><header><div class="wrap"><small>BAIE DE LA BAULE</small><h1>📅 Événements</h1><div>La Baule · Pornichet · Le Pouliguen · Guérande · 7 prochains jours</div><div class="nav"><a href="index.html">🌊 Accueil</a><a href="peche.html">🎣 Pêche & araignées</a><a href="wingfoil.html">🏄 Wingfoil</a><a href="surf.html">🏄 Surf</a><a href="evenements.html">📅 Événements</a><a href="climat.html">📊 Climat</a></div></div></header><main class="wrap"><h2>Événements à venir</h2><div class="card" id="events">Chargement…</div></main><script>async function go(){try{const d=await fetch("api/events.json?ts="+Date.now()).then(r=>r.json()),a=d.events||[];events.innerHTML=a.length?a.map(x=>`<div class="event"><b>${x.date_label||x.date} · ${x.place||""}</b><div>${x.title}</div>${x.url?`<a href="${x.url}" target="_blank" rel="noopener">Voir l’événement ↗</a>`:""}</div>`).join(""):"Aucun événement récupéré pour les 7 prochains jours."}catch(e){events.textContent="Agenda temporairement indisponible."}}go();</script></body></html>
