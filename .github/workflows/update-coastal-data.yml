name: Update coastal data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests copernicusmarine xarray netCDF4

      - name: Update temperatures
        run: python scripts/update_temperatures.py

      - name: Update tides and clarity
        run: python scripts/update_data.py
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          ATMO_USERNAME: ${{ secrets.ATMO_USERNAME }}
          ATMO_PASSWORD: ${{ secrets.ATMO_PASSWORD }}
      - name: Commit refreshed data
        run: |
          git config user.name "coastal-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/
          git diff --cached --quiet || (git commit -m "Update coastal data" && git push)
